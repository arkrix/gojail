<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Cyan Gradient for Gopher Body -->
    <linearGradient id="goCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29BEEC" />
      <stop offset="100%" stop-color="#00ADD8" />
    </linearGradient>

    <!-- Metallic Gradient for Jail Bars -->
    <linearGradient id="barMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="65%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Deep Gradient for Enclosure Frame -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- ==================== ICON EMBLEM (Left) ==================== -->
  <g transform="translate(15, 10)">
    <!-- Container / Sandbox Chamber Backplate -->
    <rect x="10" y="5" width="150" height="150" rx="26" fill="url(#frameGrad)" stroke="#00ADD8" stroke-width="3.5" stroke-opacity="0.45"/>

    <!-- Chamber Interior Depth -->
    <rect x="18" y="13" width="134" height="134" rx="18" fill="#04121F" />

    <!-- === GOPHER INSIDE === -->
    <!-- Ears -->
    <circle cx="50" cy="54" r="13" fill="#00ADD8" stroke="#007D9C" stroke-width="2.5"/>
    <circle cx="50" cy="54" r="7" fill="#F8B4B4" />

    <circle cx="120" cy="54" r="13" fill="#00ADD8" stroke="#007D9C" stroke-width="2.5"/>
    <circle cx="120" cy="54" r="7" fill="#F8B4B4" />

    <!-- Head / Torso -->
    <path d="M 45 138 C 40 80, 45 48, 85 48 C 125 48, 130 80, 125 138 Z" fill="url(#goCyanGrad)" stroke="#007D9C" stroke-width="3"/>

    <!-- Big Gopher Eyes -->
    <ellipse cx="68" cy="74" rx="13" ry="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <ellipse cx="102" cy="74" rx="13" ry="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

    <!-- Pupils (Peeking through bars) -->
    <circle cx="72" cy="74" r="6" fill="#0F172A" />
    <circle cx="74" cy="72" r="2" fill="#FFFFFF" />

    <circle cx="106" cy="74" r="6" fill="#0F172A" />
    <circle cx="108" cy="72" r="2" fill="#FFFFFF" />

    <!-- Snout & Nose -->
    <ellipse cx="85" cy="91" rx="12" ry="9" fill="#FFFFFF" />
    <ellipse cx="85" cy="87" rx="5" ry="3.5" fill="#1E293B" />

    <!-- Teeth -->
    <rect x="81.5" y="96" width="3" height="6" rx="0.8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="85.5" y="96" width="3" height="6" rx="0.8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>

    <!-- Paws gripping the chamber sill -->
    <ellipse cx="54" cy="136" rx="8.5" ry="5.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <ellipse cx="116" cy="136" rx="8.5" ry="5.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />

    <!-- === JAIL BARS === -->
    <!-- Top & Bottom Crossbars -->
    <rect x="22" y="28" width="126" height="7" rx="3.5" fill="url(#barMetalGrad)" />
    <rect x="22" y="126" width="126" height="7" rx="3.5" fill="url(#barMetalGrad)" />

    <!-- Vertical Steel Bars -->
    <rect x="36" y="18" width="8" height="124" rx="4" fill="url(#barMetalGrad)" />
    <rect x="66" y="18" width="8" height="124" rx="4" fill="url(#barMetalGrad)" />
    <rect x="96" y="18" width="8" height="124" rx="4" fill="url(#barMetalGrad)" />
    <rect x="126" y="18" width="8" height="124" rx="4" fill="url(#barMetalGrad)" />

    <!-- Padlock Accent -->
    <path d="M 80 124 L 80 119 C 80 115, 90 115, 90 119 L 90 124 Z" fill="none" stroke="#00ADD8" stroke-width="2.5" />
    <rect x="76" y="124" width="18" height="14" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="85" cy="130" r="2" fill="#FFFFFF" />
  </g>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <g transform="translate(195, 20)">
    <!-- "go" in Bold Go Cyan -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#00ADD8" letter-spacing="-2">go</text>

    <!-- "jail" in Crisp Deep Navy / Slate -->
    <text x="100" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#0F172A" letter-spacing="-2">jail</text>

    <!-- Punctuation Accent Dot in Cyan -->
    <circle cx="242" cy="80" r="7.5" fill="#00ADD8" />

    <!-- Subtitle / Tagline in Bold Dark Slate -->
    <text x="3" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="700" fill="#334155" letter-spacing="2.8">
      SECURE LINUX CONTAINER RUNTIME
    </text>
  </g>
</svg>
